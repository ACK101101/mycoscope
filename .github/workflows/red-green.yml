name: red-green

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The controller always comes from the default branch, never from the candidate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the trusted verifier
        working-directory: trusted
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify frozen RED and GREEN evidence
        working-directory: trusted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TRUNK_SHA=$(git -C ../candidate rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")
          node --import tsx scripts/check-red-green.ts \
            --repo ../candidate --base "$BASE_SHA" --head "$HEAD_SHA" --trunk "$TRUNK_SHA" \
            > "$RUNNER_TEMP/red-green.json"
      - name: Keep the evidence, including expected RED runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-green-evidence
          path: ${{ runner.temp }}/red-green.json
          if-no-files-found: warn
