name: exceptions

on: pull_request

concurrency:
  group: exceptions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --prefer-offline
      - name: Build comment from PR diff
        run: npx tsx scripts/exceptions/report-cli.ts "origin/$BASE_REF" > comment.md
      - name: Post or update the comment
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require("node:fs");
            // github-script@v7 runs on Node 20, which cannot load TypeScript directly.
            const { tsImport } = require("tsx/esm/api");
            const { publishExceptionReport } = await tsImport(
              "./scripts/exceptions/publish-pr-comment.ts", `${process.cwd()}/`
            );
            await publishExceptionReport(
              github, context.repo, context.issue.number, readFileSync("comment.md", "utf8")
            );
