name: exceptions

on: pull_request

concurrency:
  group: exceptions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --prefer-offline
      - name: Publish inline exception comments
        uses: actions/github-script@v7
        with:
          script: |
            const { tsImport } = require("tsx/esm/api");
            const { readExceptionReport } = await tsImport(
              "./scripts/exceptions/read-pr-exceptions.ts", `${process.cwd()}/`
            );
            const { publishExceptionReport } = await tsImport(
              "./scripts/exceptions/publish-pr-comment.ts", `${process.cwd()}/`
            );
            const report = readExceptionReport(`origin/${process.env.BASE_REF}`);
            await publishExceptionReport(
              github, context.repo, context.issue.number, report.commitId, report.changes
            );
