name: exceptions

on: pull_request

concurrency:
  group: exceptions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --prefer-offline
      - name: Build comment from PR diff
        run: npx tsx scripts/exceptions/report-cli.ts "origin/$BASE_REF" > comment.md
      - name: Post or update the comment
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const body = readFileSync("comment.md", "utf8");
            const marker = "<!-- mycoscope:exceptions -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const report = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" &&
              comment.body?.startsWith(marker)
            );
            if (report) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: report.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
